<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2328a66d'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white'%3E%CF%80%3C/text%3E%3C/svg%3E" />
    <title>Pling · Course workspace (Vue 2.7)</title>
  </head>
  <body>
    <header class="pling-demo-chrome">
      <a href="/examples/course-workspace-vue2" data-source="/examples/course-workspace-vue2" target="_blank" rel="noopener noreferrer">
        <span class="pling-demo-chrome__mark" aria-hidden="true">&lt;/&gt;</span>
        <span data-en="Source &amp; integration" data-zh="源码与接入">Source &amp; integration</span>
        <span aria-hidden="true">↗</span>
      </a>
      <span class="pling-demo-chrome__mode"><i aria-hidden="true"></i><span data-en="Vue 2.7 · Guided tasks" data-zh="Vue 2.7 · 引导任务">Vue 2.7 · Guided tasks</span></span>
    </header>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const zh = params.get("lang") === "zh";
      const docsBase = ["5191", "5276"].includes(location.port)
        ? `${location.protocol}//${location.hostname}:5190`
        : "";
      const source = document.querySelector("[data-source]");
      source.href = `${docsBase}${zh ? "/zh" : ""}${source.dataset.source}`;
      if (zh) {
        document.documentElement.lang = "zh-CN";
        document.querySelectorAll("[data-en][data-zh]").forEach((node) => {
          node.textContent = node.dataset.zh;
        });
      }
    </script>
    <style>
      .pling-demo-chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 42px;
        padding: 0 16px;
        border-bottom: 1px solid #dbe6f2;
        background: #fff;
        color: #64748b;
        font: 12px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .pling-demo-chrome a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #0b6db7;
        font-weight: 650;
        text-decoration: none;
      }
      .pling-demo-chrome a:hover { color: #2e9df7; }
      .pling-demo-chrome__mark {
        color: #2e9df7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
      }
      .pling-demo-chrome__mode { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
      .pling-demo-chrome__mode i { width: 6px; height: 6px; border-radius: 50%; background: #22a06b; }
      @media (max-width: 560px) {
        .pling-demo-chrome__mode { display: none; }
      }
    </style>
  </body>
</html>
