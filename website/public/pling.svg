<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pling">
  <title>Pling · Page Intelligence</title>
  <defs>
    <linearGradient id="pling-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1273cf" />
      <stop offset="100%" stop-color="#2e9df7" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#pling-mark)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- 环：右上留 75° 缺口 —— 闭环（感知→规划→执行→反馈），但不闭合（无限不循环，持续进化） -->
    <path d="M87.675 45.04 A 38 38 0 1 1 54.96 12.325" />
    <!-- π：横是「页面」，两条腿是通向操作的路 -->
    <path d="M30 38 H70" />
    <path d="M40 38 L36 76" />
    <path d="M60 38 L64 76" />
  </g>
</svg>
