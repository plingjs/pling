# Bootstrap vhost used only while Let's Encrypt issues the first certificate.
# It answers the HTTP-01 challenge before redirecting ordinary traffic to TLS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOCS_HOST__ __WWW_HOST__ __DEMO_HOST__ __API_HOST__ __SURFACE_HOST__ __TODO_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/pling/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
